[package]
name = "iptv-proxy"
version = "0.1.0"
edition = "2024"
description = "Xtream Codes / M3U reverse proxy (Rust rewrite of incmve/iptv-proxy)"
license = "GPL-3.0-or-later"
repository = "https://github.com/incmve/iptv-proxy"

[lib]
name = "iptv_proxy"
path = "src/lib.rs"

[[bin]]
name = "iptv-proxy"
path = "src/main.rs"

[dependencies]
axum = "0.8.9"
bytes = "1.12.2"
futures-util = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream"] }
subtle = "2.6.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.9"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
