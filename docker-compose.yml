services:
  gluetun:
    image: qmcgaw/gluetun
    container_name: gluetun
    restart: always
    healthcheck:
      test: ["CMD", "/gluetun-entrypoint", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - 8888:8888/tcp # gluetun HTTP proxy
      - 8388:8388/tcp # gluetun Shadowsocks
      - 8388:8388/udp # gluetun Shadowsocks
      - 8080:8080 # IPTV proxy
    volumes:
      - /data/apps/gluetun:/gluetun
    environment:
      - VPN_SERVICE_PROVIDER=protonvpn
      - OPENVPN_USER=${OPENVPN_USER}
      - OPENVPN_PASSWORD=${OPENVPN_PASSWORD}
      - SERVER_COUNTRIES=Netherlands
      - FREE_ONLY=on
      # Timezone for accurate log times
      - TZ=Europe/Amsterdam
      # Server list updater
      # See https://github.com/qdm12/gluetun-wiki/blob/main/setup/servers.md#update-the-vpn-servers-list
      - UPDATER_PERIOD=24h
      - HTTPPROXY=off
      - HTTP_CONTROL_SERVER_ADDRESS=:8001
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  iptv-proxy:
    image: incmve/iptv-proxy
    container_name: iptv-proxy
    volumes:
      # If your are using local m3u file instead of m3u remote file
      # put your m3u file in this folder
      - /data/apps/iptv-proxy:/root/iptv
    restart: on-failure
    environment:
      M3U_URL: ${M3U_URL}
      PORT: 8080
      HOSTNAME: iptvproxy
      GIN_MODE: ${GIN_MODE:-release}
      USER: ${PROXY_USER}
      PASSWORD: ${PROXY_PASSWORD}
      BUFFER_ENABLED: ${BUFFER_ENABLED:-false}
      BUFFER_DURATION: ${BUFFER_DURATION:-5}
      BUFFER_MAX_MEMORY: ${BUFFER_MAX_MEMORY:-10}
      BUFFER_PRELOAD: ${BUFFER_PRELOAD:-3}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    network_mode: "service:gluetun" # Connect to gluetun service (only if in the same compose file)
    depends_on:
      gluetun:
        condition: service_healthy
