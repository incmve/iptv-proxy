name: Docker Image CI (rust)

on:
  push:
    branches: [ "rust" ]
    tags: [ "rust-v*" ]
  pull_request:
    branches: [ "rust" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Tag must match Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/rust-v')
        run: |
          CARGO_VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          TAG_VERSION="${GITHUB_REF_NAME#rust-v}"
          if [ "$CARGO_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $CARGO_VERSION"
            exit 1
          fi

  build:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Image tags
        id: tags
        run: |
          if [[ "$GITHUB_REF" == refs/tags/rust-v* ]]; then
            V="${GITHUB_REF_NAME#rust-v}"
            echo "tags=incmve/iptv-proxy:rust,incmve/iptv-proxy:rust-$V" >> "$GITHUB_OUTPUT"
          else
            echo "tags=incmve/iptv-proxy:rust" >> "$GITHUB_OUTPUT"
          fi
      - name: Login to dockerhub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push to dockerhub
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
